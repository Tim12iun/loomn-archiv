name: archivn auf macOS 14 prüfen

# Baut archivn wie der normale Build (neues Xcode, Ziel macOS 14) und startet genau diese App
# Prüft, dass das Programm ab macOS 14 (Sonoma) startet (minos 14.0, nur Bibliotheken, die es dort gibt).
# Einen echten macOS-14-Rechner bietet GitHub nicht mehr an. Veröffentlicht kein Release.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/macos14-test.yml"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Versionen
        run: xcodebuild -version && swift --version && sw_vers
      - name: App bauen
        working-directory: LoomnArchiv
        env:
          UPDATE_REPO: ${{ github.repository }}
          BUILD: "153"
        run: scripts/build-app.sh
      - name: Mindest-macOS im Programm prüfen
        working-directory: LoomnArchiv
        run: |
          vtool -show-build build/archivn.app/Contents/MacOS/LoomnArchiv | tee vtool.txt
          grep -E "minos 14\.0" vtool.txt
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" build/archivn.app/Contents/Info.plist
          lipo -archs build/archivn.app/Contents/MacOS/LoomnArchiv
          # Verlinkte Bibliotheken: nichts, was es erst ab macOS 15 gibt
          otool -L build/archivn.app/Contents/MacOS/LoomnArchiv
      # Fertige ZIP in den Zweig archivn-macos14-app (zum Abholen per git), kein Release
      - name: App in Zweig ablegen
        working-directory: LoomnArchiv
        run: |
          out=$(mktemp -d)
          cp build/LoomnArchiv.zip vtool.txt "$out/"
          echo "Build ${BUILD:-153} · ${GITHUB_SHA} · minos 14.0" > "$out/BUILD.txt"
          cd "$out"
          git init -q -b archivn-macos14-app
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "archivn macOS 14 Build"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" archivn-macos14-app

