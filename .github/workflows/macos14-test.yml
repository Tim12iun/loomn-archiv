name: archivn auf macOS 14 prüfen

# Baut archivn wie der normale Build (neues Xcode, Ziel macOS 14) und startet genau diese App
# auf einem echten macOS-14-Rechner (Sonoma): Selbsttest, Oberfläche, Kompagnon, Titelleiste.
# Veröffentlicht nichts (kein Release, kein App-Zweig).

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/macos14-test.yml"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Versionen
        run: xcodebuild -version && swift --version && sw_vers
      - name: App bauen
        working-directory: LoomnArchiv
        env:
          UPDATE_REPO: ${{ github.repository }}
          BUILD: "153"
        run: scripts/build-app.sh
      - name: Mindest-macOS im Programm prüfen
        working-directory: LoomnArchiv
        run: |
          vtool -show-build build/archivn.app/Contents/MacOS/LoomnArchiv | tee vtool.txt
          grep -E "minos 14\.0" vtool.txt
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" build/archivn.app/Contents/Info.plist
          lipo -archs build/archivn.app/Contents/MacOS/LoomnArchiv
          # Verlinkte Bibliotheken: nichts, was es erst ab macOS 15 gibt
          otool -L build/archivn.app/Contents/MacOS/LoomnArchiv
      - uses: actions/upload-artifact@v4
        with:
          name: archivn-zip
          path: LoomnArchiv/build/LoomnArchiv.zip
          retention-days: 30

  sonoma:
    needs: build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: archivn-zip
      - name: Auspacken
        run: ditto -x -k LoomnArchiv.zip . && sw_vers && codesign --verify --verbose archivn.app
      - name: Selbsttest auf macOS 14
        run: |
          set +e
          archivn.app/Contents/MacOS/LoomnArchiv --selftest "$RUNNER_TEMP/selftest" > selftest.log 2>&1
          rc=$?
          cat selftest.log
          [ $rc -ne 0 ] && tail -5 selftest.log | sed 's/^/::error::/'
          exit $rc
      - name: Oberfläche auf macOS 14 (Bildschirmfotos, Kompagnon, Titelleiste)
        run: |
          archivn.app/Contents/MacOS/LoomnArchiv --screenshots "$RUNNER_TEMP/shots" > shots.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          cat shots.log
          mkdir -p Bilder && cp "$RUNNER_TEMP"/shots/Bilder/*.png "$RUNNER_TEMP"/shots/Bilder/*.txt Bilder/ || true
          if grep -qE "^FEHLER (Titelleiste|Griff|Hauptfenster)" shots.log; then
            grep -E "^FEHLER (Titelleiste|Griff|Hauptfenster)" shots.log | sed 's/^/::error::/'
            exit 1
          fi
          grep -qiE "crash|fatal error|dyld|Symbol not found" shots.log && exit 1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonoma-ergebnis
          path: |
            selftest.log
            shots.log
            Bilder/
          retention-days: 14
